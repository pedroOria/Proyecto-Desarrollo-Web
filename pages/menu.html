<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carta | Sabores Norteños</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>

<body>

  <!-- ========== ENCABEZADO / NAVBAR ========== -->
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container">

        <a class="navbar-brand fw-bold" href="../index.html">Sabores Norteños</a>

        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-label="Abrir menú">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navMenu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="../index.html">Inicio</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="menu.html">Carta</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="pedido.html">
                Mi pedido <span class="badge text-bg-warning" id="cart-count">0</span>
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="contacto.html">Contacto</a>
            </li>
          </ul>
        </div>

      </div>
    </nav>
  </header>

  <!-- ========== CONTENIDO PRINCIPAL ========== -->
  <main class="container section-space">

    <!-- Título de la página -->
    <div class="page-heading">
      <p class="eyebrow">Nuestra carta</p>
      <h1>Platos norteños</h1>
      <p>Selecciona tus favoritos y agrégalos a tu pedido.</p>
    </div>

    <!-- Filtros -->
    <div class="row g-3 mb-4">
      <div class="col-md-6">
        <label for="search" class="form-label">Buscar plato</label>
        <input id="search" class="form-control" type="search" placeholder="Ej. arroz con pato">
      </div>

      <div class="col-md-6">
        <label for="category" class="form-label">Categoría</label>
        <select id="category" class="form-select">
          <option value="all">Todas</option>
          <option value="entradas">Entradas</option>
          <option value="platos">Platos de fondo</option>
          <option value="bebidas">Bebidas</option>
        </select>
      </div>
    </div>

    <!-- Catálogo (se llena con JavaScript) -->
    <div id="catalog" class="row g-4" aria-live="polite"></div>

    <!-- Botón al pedido -->
    <div class="text-center mt-5">
      <a class="btn btn-primary" href="pedido.html">Ver mi pedido</a>
    </div>

  </main>

  <!-- ========== PIE DE PÁGINA ========== -->
  <footer class="site-footer">
    <div class="container py-4">
      <p class="mb-0">© 2026 Sabores Norteños · Proyecto académico</p>
    </div>
  </footer>

  <!-- ========== SCRIPTS ========== -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/catalogo.js"></script>

</body>

</html>
